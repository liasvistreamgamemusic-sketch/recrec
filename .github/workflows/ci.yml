name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Locate libclang (needed to build ASIO bindings)
        shell: pwsh
        run: ./installer/find-libclang.ps1
      - run: cargo clippy --all-targets --locked --features asio -- -D warnings
      - run: cargo test --locked --features asio
      - run: cargo build --release --locked --features asio
      - uses: actions/upload-artifact@v7
        with:
          name: recrec-windows-x64
          path: target/release/recrec.exe
          retention-days: 14
